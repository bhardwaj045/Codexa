spring.application.name=backend
server.port=8080

# ==========================================
# DEFAULT PROFILE: H2 (MySQL Mode)
# Runs out-of-the-box without requiring external database server
# ==========================================
spring.datasource.url=jdbc:h2:file:${DB_FILE_PATH:C:/Users/Raj/OneDrive/Desktop/CodeXa/backend/data/codepractice};DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Disable flyway on default profile to allow dynamic schema initialization
spring.flyway.enabled=false

# ==========================================
# DEFAULT ADMIN CREDENTIALS
# Override securely via environment variables ADMIN_EMAIL & ADMIN_PASSWORD
# ==========================================
app.admin.email=${ADMIN_EMAIL:admin@codexa.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

